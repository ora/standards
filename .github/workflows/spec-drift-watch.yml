name: spec drift watch

# Once a week, checks every standard's spec against the state last read for
# it (the pins in spec-pins.json, generated from `spec_sources` in
# content/standards). For each standard whose spec changed, it opens or
# refreshes one issue that links what changed; it closes the issue once the
# pins are moved. It also publishes a small status file to the
# `spec-drift-status` branch, which the standard pages read to show "The spec
# changed after this check."
#
# An issue still open after 14 days is escalated once (a label and a comment
# that mentions a maintainer). Each newly opened issue starts
# spec-drift-fix.yml, which asks Claude to recheck the page and open a pull
# request. A run that fails opens its own issue, closed by the next good run.
#
# The check itself is scripts/spec-drift.mjs, shared byte for byte with Ora's
# watcher (eralabs-ai/ora). It needs no npm install. Upstream content never
# reaches a shell: the script runs git and gh with argument arrays, and only
# hashes, revision names and digests reach the issues.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Two jobs, so the job that reads upstream repositories and pages holds no
# write token: `check` runs read-only and hands its report to `report`,
# which alone can write issues and the status branch.
permissions:
  contents: read

concurrency:
  group: spec-drift-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compare every spec with its pins
        id: check
        continue-on-error: true
        run: node scripts/spec-drift.mjs check spec-pins.json --out "$RUNNER_TEMP/report.json"

      - uses: actions/upload-artifact@v4
        with:
          name: spec-drift-report
          path: ${{ runner.temp }}/report.json
          retention-days: 7

  report:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the status file to the spec-drift-status branch only
      issues: write
      actions: write # start spec-drift-fix.yml for each newly opened issue
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_BRANCH: spec-drift-status
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: spec-drift-report
          path: ${{ runner.temp }}

      - name: Read the last published status
        run: |
          # The branch is missing until the first run publishes it.
          if git ls-remote --exit-code --heads origin "$STATUS_BRANCH" >/dev/null; then
            git fetch --depth 1 origin "+refs/heads/$STATUS_BRANCH:refs/remotes/origin/$STATUS_BRANCH"
            git show "origin/$STATUS_BRANCH:spec-drift.json" > "$RUNNER_TEMP/status-in.json"
          fi

      - name: Open, refresh or close the drift issues
        run: |
          node scripts/spec-drift.mjs issues "$RUNNER_TEMP/report.json" --repo "$GITHUB_REPOSITORY" \
            --status-in "$RUNNER_TEMP/status-in.json" --status-out "$RUNNER_TEMP/status-out.json" \
            --opened-out "$RUNNER_TEMP/opened.json" \
            --escalate-after 14 --escalate-label spec-drift-overdue --escalate-mention @liady

      - name: Ask Claude to fix each newly opened issue
        run: |
          # Issue numbers come from the script, which only records digits.
          for n in $(jq -r '.[].number' "$RUNNER_TEMP/opened.json"); do
            gh workflow run spec-drift-fix.yml --repo "$GITHUB_REPOSITORY" -f issue="$n"
          done

      - name: Publish the status for the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/status-branch"
          if git rev-parse --verify --quiet "origin/$STATUS_BRANCH" >/dev/null; then
            git worktree add --detach "$dir" "origin/$STATUS_BRANCH"
          else
            git worktree add --orphan -b "$STATUS_BRANCH" "$dir"
          fi
          cp "$RUNNER_TEMP/status-out.json" "$dir/spec-drift.json"
          git -C "$dir" add spec-drift.json
          if git -C "$dir" diff --cached --quiet; then
            echo "status unchanged"
            exit 0
          fi
          git -C "$dir" commit --quiet -m "chore: update spec drift status"
          git -C "$dir" push origin "HEAD:refs/heads/$STATUS_BRANCH"

      - name: Fail when a spec could not be read
        if: needs.check.outputs.outcome == 'failure'
        run: |
          echo "At least one spec source could not be read; see the check step. Its issue was left as it was."
          exit 1

  health:
    needs: [check, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED: ${{ needs.check.result != 'success' || needs.check.outputs.outcome == 'failure' || needs.report.result != 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Open or close the watch-failed issue
        run: |
          node scripts/spec-drift.mjs health --failed "$FAILED" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out "$RUNNER_TEMP/health.json"
          node scripts/spec-drift.mjs issues "$RUNNER_TEMP/health.json" --repo "$GITHUB_REPOSITORY" --label spec-drift-watch
